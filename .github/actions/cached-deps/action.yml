name: 'Get & Cache Deps'
description: 'Get the dependencies and cache them'
inputs:
  do_caching:
    description: "Do caching or not?"
    required: false
    default: 'true'
outputs:
  used-cache:
    description: 'Whether the cache has been used'
    value: ${{ steps.step_output.outputs.used_cache }}
runs:
  using: 'composite'
  steps:
    - name: Cache dependencies
      if: inputs.do_caching == 'true'
      id: cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true' || inputs.do_caching != 'true'
      shell: bash
      run: npm ci
    - name: Write to output
      id: step_output
      shell: bash
      run: echo "used_cache=${{ inputs.do_caching }}" >> $GITHUB_OUTPUT